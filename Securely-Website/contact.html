<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Securely</title>
  <meta name="description" content="Contact Securely support for privacy, billing, or product questions.">
  <link rel="canonical" href="https://trysecurely.com/contact.html">
  <meta property="og:title" content="Contact — Securely">
  <meta property="og:description" content="Contact Securely support for privacy, billing, or product questions.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trysecurely.com/contact.html">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Contact — Securely">
  <meta name="twitter:description" content="Contact Securely support for privacy, billing, or product questions.">
  <meta name="theme-color" content="#1c1b19">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <main id="content" class="wrap" style="padding-top:6.5rem">
    <p class="eyebrow">Contact</p>
    <h1>Reach the Securely team</h1>
    <p class="lede">For privacy, billing, or vulnerability reports. Operated by Securely (product of Delexoo).</p>
    <p><a class="btn" href="mailto:support@trysecurely.com">support@trysecurely.com</a></p>
    <form class="form" id="contact-form">
      <label for="name">Name
        <input id="name" name="name" autocomplete="name" required maxlength="120">
      </label>
      <label for="email">Email
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="200">
      </label>
      <label for="message">Message
        <textarea id="message" name="message" rows="5" required maxlength="4000"></textarea>
      </label>
      <p class="error" id="form-error" hidden></p>
      <p class="ok" id="form-ok" hidden></p>
      <button class="btn" id="form-btn" type="submit">Send message</button>
    </form>
  </main>
  <footer class="site-footer">
    <span>© Securely · Delexoo</span>
    <a href="/privacy.html">Privacy</a>
    <a href="/">Home</a>
  </footer>
  <script src="/site.js"></script>
  <script>
    document.querySelector("#contact-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.querySelector("#form-error");
      const ok = document.querySelector("#form-ok");
      const btn = document.querySelector("#form-btn");
      err.hidden = true;
      ok.hidden = true;
      const name = document.querySelector("#name").value.trim();
      const email = document.querySelector("#email").value.trim();
      const message = document.querySelector("#message").value.trim();
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name, email, message }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Could not send.");
        ok.textContent = data.message || "Thanks — message received.";
        ok.hidden = false;
        e.target.reset();
      } catch (ex) {
        err.textContent = ex.message || "Could not send message.";
        err.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
