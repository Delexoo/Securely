<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment confirmation — Securely</title>
  <meta name="description" content="Your Securely subscription payment was received.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1c1b19">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="wrap" style="padding-top:6rem">
    <p class="eyebrow">Checkout</p>
    <h1 id="title">Confirming payment…</h1>
    <p class="lede" id="lede">Securely is verifying your Stripe checkout so the Windows app can unlock immediately.</p>
    <p id="status" class="note" role="status"></p>
    <p><a class="btn" href="/">Back home</a> <a class="btn ghost" href="/billing.html">Billing help</a></p>
  </main>
  <script>
    (async () => {
      const title = document.querySelector("#title");
      const lede = document.querySelector("#lede");
      const status = document.querySelector("#status");
      const sessionId = new URLSearchParams(location.search).get("session_id") || "";
      if (!sessionId) {
        title.textContent = "Payment received";
        lede.textContent = "Return to the Securely app — Billing should show Active once Stripe finishes.";
        return;
      }
      try {
        const res = await fetch("/api/checkout-status", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ sessionId }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Could not confirm checkout.");

        const payload = {
          type: "securely-checkout-done",
          email: data.email || "",
          active: !!data.active,
          status: data.status || "",
          sessionId,
        };
        // Notify the Securely dashboard if this tab was opened from the app.
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, "*");
          }
        } catch { /* cross-origin / closed */ }

        if (data.active) {
          title.textContent = "You're subscribed";
          lede.innerHTML = data.email
            ? `Securely is <strong>active</strong> for <strong>${data.email}</strong>. The app should unlock right away — you can close this tab.`
            : "Securely is <strong>active</strong>. Return to the app — scans should unlock immediately.";
          status.textContent = "Subscription connected.";
        } else {
          title.textContent = "Payment received";
          lede.textContent = "Stripe accepted the payment. Return to the Securely app — status updates when confirmation finishes.";
          status.textContent = data.status ? `Stripe status: ${data.status}` : "";
        }
      } catch (err) {
        title.textContent = "Payment received";
        lede.textContent = "Thanks for subscribing. Return to the Securely app — Billing updates when Stripe confirms.";
        status.textContent = err.message || "Could not auto-confirm.";
      }
    })();
  </script>
</body>
</html>
