<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Securely</title>
  <meta name="theme-color" content="#161a22">
  <meta name="description" content="Securely desktop threat monitor — OCR and AI on your primary screen.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/securely.css">
</head>
<body>
  <a class="skip" href="#shell">Skip to Securely</a>
  <div id="frame">
    <svg id="trace" aria-hidden="true">
      <defs>
        <linearGradient id="trace-grad" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="50%" stop-color="#c8c8c8"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
      </defs>
      <rect pathLength="100" fill="none"/>
      <rect class="lag-5" pathLength="100" fill="none"/>
      <rect class="lag-10" pathLength="100" fill="none"/>
      <rect class="lag-16" pathLength="100" fill="none"/>
    </svg>
    <div id="shell" data-layout="square">
      <div id="pill">
        <div id="toolbar" class="island-toolbar">
          <button id="send" class="scan-pill is-send" data-mode="quick" type="button" aria-pressed="false" aria-label="Quick Scan" title="Quick Scan · right-click to change mode">
            <span class="scan-label">Quick</span>
          </button>

          <div class="status-block">
            <p id="status-line" class="status-line" data-state="idle" title="Status">
              <svg class="status-icon status-idle" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="7.2"/>
              </svg>
              <svg class="status-icon status-scanning" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.2"/>
                <path d="m16.2 16.2 3.3 3.3"/>
              </svg>
              <svg class="status-icon status-safe" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3.5 19 6.2v5.1c0 4.6-3 7.9-7 9.2-4-1.3-7-4.6-7-9.2V6.2L12 3.5z"/>
                <path d="m9.2 12.1 1.9 1.9 3.7-3.8"/>
              </svg>
              <svg class="status-icon status-warning" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 4.2 20.2 18.5H3.8L12 4.2z"/>
                <path d="M12 10v4.2"/>
                <path d="M12 16.8h.01"/>
              </svg>
              <svg class="status-icon status-phishing" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="7.5"/>
                <path d="M12 8v5"/>
                <path d="M12 15.8h.01"/>
              </svg>
              <span id="status-text">Idle</span>
            </p>
            <p class="status-sub" id="status-sub">Securely</p>
          </div>

          <div class="tool-cluster">
            <button id="home-btn" class="tool solid" type="button" aria-label="Dashboard" title="Dashboard">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="4" width="7" height="7" rx="1.5"/>
                <rect x="13" y="4" width="7" height="7" rx="1.5"/>
                <rect x="4" y="13" width="7" height="7" rx="1.5"/>
                <rect x="13" y="13" width="7" height="7" rx="1.5"/>
              </svg>
            </button>

            <button id="settings-btn" class="tool solid" type="button" aria-label="Settings" title="Settings">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8h16"/>
                <path d="M4 16h16"/>
                <circle cx="9" cy="8" r="2.1"/>
                <circle cx="15" cy="16" r="2.1"/>
              </svg>
            </button>

            <button id="audit-btn" class="tool solid" type="button" aria-label="Audit Log" title="Audit Log">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4.5h6.8L18 8.7V19a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 19V6A1.5 1.5 0 0 1 7.5 4.5z"/>
                <path d="M13.5 4.8V9H17.6"/>
                <path d="M9 13h6"/>
                <path d="M9 16.5h4"/>
              </svg>
            </button>

            <button id="layout-btn" class="tool solid layout-cycle" type="button" aria-label="Reshape widget" title="Reshape · small island, vertical, big square, or normal pill">
              <svg class="icon layout-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="3"/>
              </svg>
            </button>

            <button id="drag" class="drag-dots" type="button" aria-label="Move Securely" title="Drag">
              <svg viewBox="0 0 10 16" aria-hidden="true">
                <circle cx="2.2" cy="2.2" r="1.55"/>
                <circle cx="7.8" cy="2.2" r="1.55"/>
                <circle cx="2.2" cy="8" r="1.55"/>
                <circle cx="7.8" cy="8" r="1.55"/>
                <circle cx="2.2" cy="13.8" r="1.55"/>
                <circle cx="7.8" cy="13.8" r="1.55"/>
              </svg>
            </button>

            <button id="exit-btn" class="tool ghost" type="button" aria-label="Hide Securely" title="Hide (Ctrl+\). Quit from the dashboard.">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 7l10 10"/>
                <path d="M17 7 7 17"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="privacy-gate" class="privacy-gate" hidden>
          <p class="privacy-copy">
            <strong>Sensitive details on screen.</strong>
            <span id="privacy-kinds">Passwords, IDs, payment info, or other private data may be visible.</span>
            AI will not see this unless you continue.
          </p>
          <div class="privacy-actions">
            <button type="button" id="privacy-stop" class="privacy-btn privacy-stop">Stop</button>
            <button type="button" id="privacy-continue" class="privacy-btn privacy-continue">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p id="status" class="sr-only" aria-live="polite">Securely idle</p>
  <script src="/sensitive.js"></script>
  <script src="/app.js"></script>
</body>
</html>
